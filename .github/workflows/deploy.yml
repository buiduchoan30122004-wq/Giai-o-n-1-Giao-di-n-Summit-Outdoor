name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # ⚠️ QUAN TRỌNG: Sửa lại đường dẫn này thành thư mục chứa code trên VPS của bạn
            cd /var/www/Giai-o-n-1-Giao-di-n-Summit-Outdoor
            
            # Kéo code mới nhất từ GitHub
            git pull origin main
            
            # Cài đặt thư viện mới (nếu có) và Build lại
            yarn install
            yarn build
            
            # Khởi động lại ứng dụng qua PM2 (Sửa tên app nếu cần)
            pm2 restart trail-running-store || pm2 start yarn --name "trail-running-store" -- start
