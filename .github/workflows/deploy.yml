name: Deploy Website and MCP Server to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Website Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/buiduchoan30122004-wq/giai-o-n-1-giao-di-n-summit-outdoor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MCP Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          tags: ghcr.io/buiduchoan30122004-wq/summit-mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            # Create deployment directory
            mkdir -p /opt/summit-outdoor/data
            
            # Login to GitHub Container Registry on VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest Docker images
            docker pull ghcr.io/buiduchoan30122004-wq/giai-o-n-1-giao-di-n-summit-outdoor:latest
            docker pull ghcr.io/buiduchoan30122004-wq/summit-mcp-server:latest
            
            # Stop and remove existing containers
            docker stop summit-outdoor || true
            docker rm summit-outdoor || true
            docker stop summit-mcp-server || true
            docker rm summit-mcp-server || true
            
            # Run the Website container
            docker run -d \
              --name summit-outdoor \
              --restart unless-stopped \
              -p 3000:3000 \
              --network goclaw-net \
              --env-file /opt/summit-outdoor/.env \
              -e HOSTNAME=0.0.0.0 \
              -v /opt/summit-outdoor/data:/app/data \
              ghcr.io/buiduchoan30122004-wq/giai-o-n-1-giao-di-n-summit-outdoor:latest
              
            # Run the MCP Server container
            docker run -d \
              --name summit-mcp-server \
              --restart unless-stopped \
              -p 8000:8000 \
              --network goclaw-net \
              --env-file /opt/summit-outdoor/.env \
              -v /opt/summit-outdoor/data:/opt/summit-outdoor/data \
              -e DATABASE_PATH=/opt/summit-outdoor/data/brain.db \
              ghcr.io/buiduchoan30122004-wq/summit-mcp-server:latest
            
            # Clean up old unused images
            docker image prune -f
