name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "."
          target: "/var/www/summit-outdoor"
          exclude: "brain.db"

      - name: Build and Restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/summit-outdoor
            
            # Cài đặt thư viện mới (nếu có) và Build lại
            yarn install
            yarn build
            
            # Giải phóng cổng 3000 (nếu bị kẹt) và khởi động lại sạch tiến trình PM2
            npx kill-port 3000 || true
            pm2 delete summit-outdoor || true
            pm2 delete 0 || true
            pm2 start yarn --name "summit-outdoor" -- start
            
            # Đợi 5 giây để ghi lại logs trạng thái nhằm phục vụ debug từ xa
            sleep 5
            pm2 status
            pm2 logs summit-outdoor --lines 50 --no-daemon &
            sleep 3
            kill $! || true
